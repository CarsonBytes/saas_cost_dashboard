services:
  dashboard:
    build: .
    container_name: saas-cost-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8095
    ports:
      # Cut over 2026-08-13: was 18095:8095 during parallel testing (native
      # Windows launcher still serving 8095). Native launcher decommissioned,
      # so this is now the sole deployment -- plain 8095:8095.
      - "8095:8095"
    volumes:
      # ADDED 2026-08-18: noc_state.json / alert_state.json / alert_settings.json
      # (see noc.py, alerts.py) previously lived directly in /app with nothing
      # mounted -- every redeploy silently wiped incidents, restart counts,
      # locks, and quarantine flags. Confirmed live, twice in one day: an
      # outage's evidence disappeared mid-investigation, and a redeploy once
      # cleared a quarantine flag while the container it tracked was still
      # genuinely paused, leaving auto-heal about to "restart" an
      # intentionally-paused container. A named volume survives `docker
      # compose up --build` recreating the container; only `down -v` removes it.
      - noc-state:/app/state
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - restart-proxy

  # Restart-only Docker proxy (see restart_proxy.py): the ONLY component that
  # holds the host Docker socket. The dashboard no longer mounts it (FIXED
  # 2026-08-15: a public-facing dashboard holding raw socket access was
  # effectively root over every container on the host, reachable from the open
  # internet). The proxy accepts exactly one action -- POST /restart for a
  # container name on its allow-list -- so a compromised dashboard can only
  # restart the three auto-heal agents, nothing else on the daemon. No host
  # port is published; the dashboard reaches it over the compose-internal
  # network only.
  restart-proxy:
    build: .
    container_name: saas-cost-restart-proxy
    restart: unless-stopped
    command: ["python", "restart_proxy.py"]
    environment:
      - RESTART_PROXY_PORT=8096
      - ALLOWED_CONTAINERS=quant-dashboard-docker,event-radar,study-app,quant-dashboard-live-docker,event-radar-demo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost', 8096)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  default:
    # Same fix quant/study-platform's docker-compose.yml already document and
    # needed: Docker's bridge defaults to MTU 1500, but larger packets (a TLS
    # ClientHello -- exactly what a Supabase HTTPS call sends) get silently
    # blackholed somewhere in the real WSL2->host->internet path even when
    # eth0 itself reports 1500, since that's the WSL VM's own logical
    # interface, not the effective path MTU. Confirmed live: without this,
    # every Supabase call failed with "_ssl.c:993: handshake operation timed
    # out" -- a real, reproduced instance of the same failure class those
    # other Dockerfiles' comments describe, not a theoretical worry.
    # Distinct subnet from quant (172.29.0.0/16), study-platform
    # (172.28.0.0/16), and event-radar (172.30.0.0/16) on this same host.
    ipam:
      config:
        - subnet: 172.31.0.0/16
    driver_opts:
      com.docker.network.driver.mtu: "1380"

volumes:
  noc-state:   # incidents/restarts/locks/quarantine + alert dedup/threshold -- see the dashboard service's mount comment
